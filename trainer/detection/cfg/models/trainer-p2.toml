# Small-object Trainer variant with an additional stride-4 detection level.
# Use as trainer-p2-n, trainer-p2-s, trainer-p2-m, trainer-p2-l, or trainer-p2-x.

nc = 80
strides = [4, 8, 16, 32]

backbone = [
    [-1, 1, "Conv", [64, 3, 2]],
    [-1, 1, "Conv", [128, 3, 2]],
    [-1, 2, "RELAN", [256]],           # P2/4
    [-1, 1, "Conv", [256, 3, 2]],
    [-1, 2, "RELAN", [512]],           # P3/8
    [-1, 1, "Conv", [512, 3, 2]],
    [-1, 2, "A2Block", [512]],         # P4/16
    [-1, 1, "Conv", [1024, 3, 2]],
    [-1, 2, "A2Block", [1024]],
    [-1, 1, "SPPF", [1024, 5]],        # P5/32
]

head = [
    [-1, 1, "Upsample", [2]],
    [[-1, 6], 1, "Concat", [1]],
    [-1, 2, "RELAN", [512]],           # P4/16
    [-1, 1, "Upsample", [2]],
    [[-1, 4], 1, "Concat", [1]],
    [-1, 2, "RELAN", [256]],           # P3/8
    [-1, 1, "Upsample", [2]],
    [[-1, 2], 1, "Concat", [1]],
