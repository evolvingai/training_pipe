# Trainer default detector architecture: R-ELAN with area attention.
# Entries: [from, repeats, "Module", [args]]. "nc" in args resolves to the class count.

nc = 80
strides = [8, 16, 32]

backbone = [
    [-1, 1, "Conv", [64, 3, 2]],       # 0  P1/2
    [-1, 1, "Conv", [128, 3, 2]],      # 1  P2/4
    [-1, 2, "RELAN", [256]],           # 2
    [-1, 1, "Conv", [256, 3, 2]],      # 3  P3/8
    [-1, 2, "RELAN", [512]],           # 4
    [-1, 1, "Conv", [512, 3, 2]],      # 5  P4/16
    [-1, 2, "A2Block", [512]],         # 6
    [-1, 1, "Conv", [1024, 3, 2]],     # 7  P5/32
    [-1, 2, "A2Block", [1024]],        # 8
    [-1, 1, "SPPF", [1024, 5]],        # 9
]

head = [
    [-1, 1, "Upsample", [2]],          # 10
    [[-1, 6], 1, "Concat", [1]],       # 11  cat P4
    [-1, 2, "RELAN", [512]],           # 12
    [-1, 1, "Upsample", [2]],          # 13
    [[-1, 4], 1, "Concat", [1]],       # 14  cat P3
    [-1, 2, "RELAN", [256]],           # 15  P3/8 out
    [-1, 1, "Conv", [256, 3, 2]],      # 16
    [[-1, 12], 1, "Concat", [1]],      # 17
    [-1, 2, "RELAN", [512]],           # 18  P4/16 out
    [-1, 1, "Conv", [512, 3, 2]],      # 19
    [[-1, 9], 1, "Concat", [1]],       # 20
    [-1, 2, "A2Block", [1024]],        # 21  P5/32 out
    [[15, 18, 21], 1, "Detect", ["nc", "reg_max"]],  # 22
]

# depth multiple, width multiple, max channels
[scales]
n = [0.33, 0.25, 1024]
s = [0.33, 0.50, 1024]
m = [0.67, 0.75, 768]
l = [1.00, 1.00, 512]
x = [1.00, 1.25, 512]
