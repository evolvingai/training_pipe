# Trainer paper architecture: YOLOv12 C3k2 + R-ELAN/A2C2f.
# Entries: [from, repeats, "Module", [args]]. "nc" in args resolves to the class count.

nc = 80
strides = [8, 16, 32]

backbone = [
    [-1, 1, "Conv", [64, 3, 2]],       # 0  P1/2
    [-1, 1, "Conv", [128, 3, 2]],      # 1  P2/4
    [-1, 2, "C3k2", [256, false, 0.25]], # 2
    [-1, 1, "Conv", [256, 3, 2]],      # 3  P3/8
    [-1, 2, "C3k2", [512, false, 0.25]], # 4
    [-1, 1, "Conv", [512, 3, 2]],      # 5  P4/16
    [-1, 4, "A2C2f", [512, true, 4]],  # 6
    [-1, 1, "Conv", [1024, 3, 2]],     # 7  P5/32
    [-1, 4, "A2C2f", [1024, true, 1]], # 8
]

head = [
    [-1, 1, "Upsample", [2]],          # 9
    [[-1, 6], 1, "Concat", [1]],       # 10  cat P4
    [-1, 2, "A2C2f", [512, false, -1]], # 11
    [-1, 1, "Upsample", [2]],          # 12
    [[-1, 4], 1, "Concat", [1]],       # 13  cat P3
    [-1, 2, "A2C2f", [256, false, -1]], # 14  P3/8 out
    [-1, 1, "Conv", [256, 3, 2]],      # 15
    [[-1, 11], 1, "Concat", [1]],      # 16
    [-1, 2, "A2C2f", [512, false, -1]], # 17  P4/16 out
    [-1, 1, "Conv", [512, 3, 2]],      # 18
    [[-1, 8], 1, "Concat", [1]],       # 19
    [-1, 2, "C3k2", [1024, true]],     # 20  P5/32 out
    [[14, 17, 20], 1, "Detect", ["nc", "reg_max"]],  # 21
]

# depth multiple, width multiple, max channels
[scales]
n = [0.50, 0.25, 1024]
s = [0.50, 0.50, 1024]
m = [0.50, 1.00, 512]
l = [1.00, 1.00, 512]
x = [1.00, 1.50, 512]
