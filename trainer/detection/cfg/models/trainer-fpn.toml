# Alternate neck: top-down-only FPN (no PAN bottom-up path).
# Proves the neck contract with a different aggregation topology.

nc = 80
strides = [8, 16, 32]

backbone = [
    [-1, 1, "Conv", [64, 3, 2]],       # 0  P1/2
    [-1, 1, "Conv", [128, 3, 2]],      # 1  P2/4
    [-1, 2, "RELAN", [256]],           # 2
    [-1, 1, "Conv", [256, 3, 2]],      # 3  P3/8
    [-1, 2, "RELAN", [512]],           # 4
    [-1, 1, "Conv", [512, 3, 2]],      # 5  P4/16
    [-1, 2, "A2Block", [512]],         # 6
    [-1, 1, "Conv", [1024, 3, 2]],     # 7  P5/32
