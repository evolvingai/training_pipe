# trainer default configuration. Every key is overridable from CLI/kwargs.

task = "detect"
model = "trainer-n"
data = ""
project = "runs"
name = "exp"
exist_ok = false
seed = 0
deterministic = false
device = ""

epochs = 100
batch = 16
autobatch = false
imgsz = 640
workers = 8
optimizer = "adamw"
lr0 = 0.01
lrf = 0.1
cos_lr = true
momentum = 0.937
weight_decay = 0.0005
muon_weight = 0.2
sgd_weight = 1.0
# Opt-in optimizer experiments. -1 keeps Muon's beta coupled to SGD momentum.
muon_beta = -1.0
muon_ns_steps = 5
muon_batch_ns = false
muon_exclude_outputs = false
muon_exclude_stem = false
muon_exclude_depthwise = false
muon_split_qkv = false
muon_schedule = "constant"
muon_taper_start = 300  # completed epochs before the first taper epoch
muon_taper_end = 400    # final epoch (one-based), at which Muon weight reaches zero
muon_log_interval = 0  # attempted optimizer updates; 0 disables per-parameter diagnostics
profile = false       # synchronized timing adds overhead; compare profiled runs separately
loss_diagnostics = false
warmup_epochs = 3.0
warmup_momentum = 0.8
warmup_bias_lr = 0.15
nbs = 64
amp = true
ema_decay = 0.9999
ema_warmup_steps = 2000
freeze = 0
resume = ""
resume_mode = "exact"  # continue: changed LR/horizon; branch: controlled fork with preserved prefix state
save_period = -1
multiscale = false
multiscale_range = [0.5, 1.5]
multiscale_prob = 0.5
compile = true
channels_last = true
balanced_sampling = false

patience = 50
early_stop_metric = "mAP50-95"
early_stop_min_delta = 0.001
early_stop_min_epochs = 50
early_stop_restore_best = true

box = 7.5
cls = 0.5
dfl = 1.5
cls_loss = "bce"
focal_gamma = 1.5
label_smoothing = 0.0  # nonzero smoothing of soft quality targets is not supported
tal_topk = 20
reg_max = 16
reg_channels = 0       # 0: historical automatic width; explicit width isolates DFL-bin experiments
assignment_metric = "iou"  # "ciou" is a retraining experiment

# Training only: frozen teacher, same augmented images, GT-foreground supervision.
teacher = ""
distill_feature_weight = 0.0
distill_cls_weight = 0.0
distill_box_weight = 0.0
distill_temperature = 2.0

aug_profile = "generic"
mosaic = 1.0
mosaic9 = 0.0
close_mosaic = 25
mixup = 0.2
mixup_alpha = 1.5
copy_paste = 0.1
copy_paste_iou = [0.10, 0.55]
degrees = 0.0
translate = 0.1
scale = 0.5
shear = 0.0
perspective = 0.0
flipud = 0.0
fliplr = 0.5
hsv_h = 0.015
hsv_s = 0.7
hsv_v = 0.4
blur = 0.1
noise = 0.1
jpeg = 0.0
erasing = 0.0
square_crop = true
square_crop_jitter = 0.2
min_box_visibility = 0.1

cache = "disk"
fraction = 1.0

conf = 0.25
val_conf = 0.01
iou = 0.5
max_det = 300
nms_multi_label = false
confusion_conf = 0.25
confusion_iou = 0.45
compare_pycoco = false
eval_weights = "ema"   # "raw" explicitly selects raw weights from a training checkpoint
val_period = 1
val_batch = 0
log_per_class = false
val_compute_loss = false

mlflow = false
mlflow_experiment = "trainer"
mlflow_tracking_uri = ""
mlflow_run_name = "run"
tracker_retries = 0
tracker_backoff = 1.0

tune_iterations = 30
tune_epochs = 10
tune_max_trials = 300
tune_patience = 50
tune_min_delta = 0.001
tune_min_trials = 20
tune_metric = "mAP50-95"

thresh_fitness = "f1"
thresh_sweep_steps = 200
thresh_min_fitness = 0.3

format = "onnx"
opset = 17
dynamic = false
half = false
int8 = false
workspace = 4
